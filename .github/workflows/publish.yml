# SPDX-License-Identifier: MIT OR Apache-2.0
name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify packaging only; do not publish"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: Publish crates
    # Only the repository owner may start a publish run. The environment below also requires
    # manual approval and holds the crates.io token.
    if: github.actor == 'omkarium'
    environment: crates-io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Package
        run: cargo package --workspace --locked

      # The CLI package depends on rustweave-core. Its dry run only succeeds after the core crate
      # is available on the registry, so the manual dry run covers the core crate.
      - name: Publish dry run (core)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish -p rustweave-core --locked --dry-run

      - name: Publish core
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p rustweave-core --locked

      - name: Wait for the registry index
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: sleep 30

      - name: Publish CLI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p rustweave --locked
