# SPDX-License-Identifier: MIT OR Apache-2.0
[workspace]
resolver = "2"
members = ["crates/rustweave-core", "crates/rustweave"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
publish = true
authors = ["Venkatesh Omkaram"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/omkarium/rustweave"
homepage = "https://github.com/omkarium/rustweave"
keywords = ["dataweave", "interpreter", "json", "expression", "cli"]
categories = [
    "command-line-utilities",
    "development-tools",
    "parser-implementations",
]

[workspace.dependencies]
aes-gcm = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "=1.4.0"
hkdf = "0.12"
hmac = "0.12"
md-5 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
pbkdf2 = "0.12"
quick-xml = "=0.39.4"
rand = "0.8"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
yaml-rust2 = "=0.11.1"
rustweave-core = { path = "crates/rustweave-core", version = "0.3.0" }

# Integration-test binaries share helper modules, so helpers used by only some
# targets are otherwise reported as dead code. Library and binary targets keep
# their own `#![deny(dead_code)]`.
[workspace.lints.rust]
dead_code = "allow"
